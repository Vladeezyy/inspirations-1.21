modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Vladeezyy/inspirations-1.21/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/inspirations"
authors="${mod_authors}"
credits="/u/nox-cgt for the idea and texture for heartbeets, /u/TheTrone for the syringa texture, TimGoll for the carpeted trapdoor texture. Port to NeoForge ${minecraft_version}: Vladeezyy"
description='''
Adds many small features with a variety of inspirations.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kilnwork"
    type="required"
    versionRange="${kilnwork_range}"
    ordering="NONE"
    side="BOTH"
