plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'Inspirations-neoforge'
}

repositories {
    mavenLocal() // Kilnwork (./gradlew publishToMavenLocal in the kilnwork repository)
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources.srcDir 'src/generated/resources'

// Tests (src/selftest): loaded in dev runs only, never part of the jar
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    selftestImplementation.extendsFrom implementation
    selftestCompileOnly.extendsFrom compileOnly
}

neoForge {
    // -Pneo_version=<build> checks another NeoForge build
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // tools/scenetest.sh: client scene with screenshots and checks (src/selftest)
        scene {
            client()
            systemProperty 'inspirations.scene', project.findProperty('scene') ?: 'main'
            systemProperty 'inspirations.scene.lang', project.findProperty('scene_lang') ?: 'en_us'
            if (project.hasProperty('jfr')) jvmArgument '-XX:StartFlightRecording=filename=' + file('run/stress.jfr') + ',settings=profile'
        }
        // tools/selftest.sh: functional checks on a fresh world, then stops (src/selftest)
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'inspirations.selftest', 'true'
        }
        // tools/nettest.sh: a dev client joins a dev dedicated server
        netServer {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-net')
        }
        netClient {
            client()
            systemProperty 'inspirations.scene', 'net'
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.vladeezyy:kilnwork:${kilnwork_version}"
    // Kilnwork ships inside the jar, NeoForge picks the newest copy if another mod brings one
    jarJar("dev.vladeezyy:kilnwork") {
        version {
            strictly "[${kilnwork_version},)"
            prefer kilnwork_version
        }
    }
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    // runs without JEI: -Pno_jei
    if (!project.hasProperty('no_jei')) {
        localRuntime "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"
    }
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_sodium}"
        localRuntime "maven.modrinth:iris:${compat_iris}"
        localRuntime "maven.modrinth:lithium:${compat_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_ferritecore}"
        localRuntime "maven.modrinth:modernfix:${compat_modernfix}"
        localRuntime "maven.modrinth:jade:${compat_jade}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            kilnwork_range         : kilnwork_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.addModdingDependenciesTo(sourceSets.selftest)

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_inspirations' } }
    from('licenses') { into 'licenses/inspirations' }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
